<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SteelNest AI — Page Not Found</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0d12;
      --card: #111520;
      --border: #1e2535;
      --primary: #3b82f6;
      --primary-glow: rgba(59,130,246,0.15);
      --text: #f1f5f9;
      --muted: #64748b;
      --accent: #22d3ee;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    /* Ambient glow blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.2;
      z-index: 0;
      animation: float 8s ease-in-out infinite;
    }
    .blob-1 { width: 400px; height: 400px; background: #3b82f6; top: -10%; left: -5%; }
    .blob-2 { width: 300px; height: 300px; background: #22d3ee; bottom: -5%; right: 5%; animation-delay: -4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-20px) scale(1.05); }
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 520px;
      width: 100%;
    }

    /* Logo */
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 2.5rem;
      opacity: 0.9;
    }
    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #3b82f6, #22d3ee);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .logo-text {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .logo-text span { color: var(--primary); }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 32px 64px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
    }

    /* 404 badge */
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--primary);
      background: var(--primary-glow);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 999px;
      padding: 4px 14px;
      margin-bottom: 1.25rem;
    }

    /* Number */
    .error-code {
      font-size: clamp(5rem, 15vw, 7rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #f1f5f9 30%, #64748b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
      letter-spacing: -0.04em;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.6rem;
    }

    .description {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    /* Divider */
    .divider {
      width: 40px; height: 2px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 999px;
      margin: 0 auto 1.5rem;
    }

    /* Buttons */
    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 10px;
      padding: 10px 20px;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      box-shadow: 0 4px 14px rgba(59,130,246,0.35);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59,130,246,0.45); }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); background: rgba(255,255,255,0.04); }

    /* Status pill */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2rem;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="container">
    <div class="logo">
      <div class="logo-icon">⚙️</div>
      <span class="logo-text">Steel<span>Nest</span> AI</span>
    </div>

    <div class="card">
      <div class="badge">404 · Page Not Found</div>
      <div class="error-code">404</div>
      <div class="divider"></div>
      <p class="title">This page doesn't exist</p>
      <p class="description">
        The route you're looking for may have been moved, renamed,<br/>
        or is temporarily unavailable.
      </p>
      <div class="actions">
        <a href="/" class="btn btn-primary">
          ← Back to Workbench
        </a>
        <button onclick="history.back()" class="btn btn-ghost">
          Go Back
        </button>
      </div>
      <div class="status">
        <div class="status-dot"></div>
        SteelNest AI · 1810 Systems
      </div>
    </div>
  </div>
</body>
</html>
